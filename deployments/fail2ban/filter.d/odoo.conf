# fail2ban filter for Odoo login bruteforce
# Ловит 401/403 на /web/login и частые POST

[Definition]
failregex = ^<HOST> .* "POST /web/login HTTP/.*" 401
            ^<HOST> .* "POST /web/login HTTP/.*" 403
            ^<HOST> .* "POST /web/session/authenticate HTTP/.*" 200.*"error".*

ignoreregex =
