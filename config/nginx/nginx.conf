user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging (JSON для Loki/Prometheus) ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main;

    # --- Performance ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65;
    keepalive_requests 1000;
    client_max_body_size 50m;
    client_body_buffer_size 128k;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss application/x-javascript
        image/svg+xml font/woff font/woff2;

    # --- Security headers (базовые, HSTS добавляется после SSL) ---
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=odoo_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream Odoo
    upstream odoo {
        server odoo:8069 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream odoo_longpolling {
        server odoo:8072 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream backup_api {
        server backup-api:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
