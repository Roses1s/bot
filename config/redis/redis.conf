# Redis — кэш сессий Odoo / rate-limit
# Минимальный конфиг для продакшена (перекрывает дефолт)

bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Память
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Персистентность — RDB достаточно для кэша, AOF отключён для скорости
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly no

# Сеть
# requirepass CHANGE_ME_REDIS_PASSWORD  # раскомментируйте и добавьте в .env если нужно
