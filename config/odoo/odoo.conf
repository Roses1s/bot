# =============================================================================
# Odoo 17 — Production Configuration
# Документация: https://www.odoo.com/documentation/17.0/administration/install.html
# =============================================================================

[options]
; --- Database ---
db_host = db
db_port = 5432
db_user = %(ENV_POSTGRES_USER)s
db_password = %(ENV_POSTGRES_PASSWORD)s
db_name = %(ENV_POSTGRES_DB)s
db_maxconn = 64
db_template = template0

; --- Server ---
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
proxy_mode = True
; Доверяем X-Forwarded-* от Nginx
; workers >0 включает multi-processing (обязательно для продакшена)
workers = 4
; workers = (CPU * 2) + 1, напр. 4 ядра -> 9, но не более 8-12 без тестов
max_cron_threads = 2
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192
; Longpolling для Discuss / live chat
longpolling_port = 8072

; --- Paths ---
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; --- Admin ---
admin_passwd = %(ENV_ODOO_ADMIN_PASSWD)s
list_db = False  ; скрыть список БД на /web/database/selector (безопасность)

; --- Logging ---
log_level = info
log_handler = :INFO
log_db = False
log_db_level = warning

; --- Email (перекрывается в UI, но полезно для старта) ---
; smtp_server = smtp.example.com
; smtp_port = 587
; smtp_ssl = False
; smtp_user = noreply@example.com
; smtp_password = ...

; --- Security ---
; без демо-данных в продакшене
without_demo = True

; --- Performance ---
; Включить, если используете CDN для /web/static/*
; x_sendfile = True
