# =============================================================================
# odoo.sweb.conf — облегчённый конфиг для SpaceWeb VPS 1-2 ГБ RAM
# Кладётся поверх config/odoo/odoo.conf через volume
# Использование: в docker-compose.sweb.yml добавить
#   volumes:
#     - ./deploy/sweb/odoo.sweb.conf:/etc/odoo/odoo.conf:ro
# Или просто поменяйте workers вручную в odoo.conf
# =============================================================================

[options]
db_host = db
db_port = 5432
db_user = %(ENV_POSTGRES_USER)s
db_password = %(ENV_POSTGRES_PASSWORD)s
db_name = %(ENV_POSTGRES_DB)s
db_maxconn = 32
db_template = template0

http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
proxy_mode = True

# === SpaceWeb: 1 ГБ RAM → 2 workers, 2-4 ГБ → 3 workers ===
# Формула: workers = CPU*2+1, но не больше RAM/500МБ
workers = 2
max_cron_threads = 1
limit_memory_soft = 1073741824  ; 1 ГБ
limit_memory_hard = 1342177280  ; 1.25 ГБ
limit_time_cpu = 300
limit_time_real = 600
limit_request = 4096
longpolling_port = 8072

addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

admin_passwd = %(ENV_ODOO_ADMIN_PASSWD)s
list_db = False
without_demo = True

log_level = info
log_handler = :INFO
