[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-crm-infra"
version = "1.0.0"
description = "Odoo 17 CRM — infrastructure, backup service, tests"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "croniter>=2.0.3",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["scripts/backup/app", "tests"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
